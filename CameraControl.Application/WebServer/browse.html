		</fieldset>
      </li>
	   <li>
		<fieldset><legend>窗口控制</legend>

		 <input type="text" name="param1" />
		 <input type="text" name="param2" />
		 <input type="submit" value="Execute" id="execute">
		 </form>

	   </fieldset>
	  </li>	 
	   <li>
		<fieldset><legend>Command result</legend>
          <textarea id="result" rows="7" cols="100"></textarea>

</div>
<script type="text/javascript">
   window.setInterval(function(){
      $("#browseimg").attr("src","/preview.jpg?rand=" + Math.random());
   }, 1000);
  
$("#execute").click(function(){
  $.ajax({
    type: 'GET', 
    url: '/', 
    data: $('#Form').serialize(),
    success: function (x) {                
      $("#result").html(x);
    },
    beforeSend:function(){
      $("#result").html("Loading...")
    }
  });
  return false;
});

   
  $(".submenu1 button:first").button({
      icons: {
	primary: "ui-icon-arrow-4-diag"
	},
      text: true
    }).next().button({
      icons: {

	},
      text: true
    }).next().button({
      icons: {
	primary: "ui-icon-carat-1-w"
	},
      text: true
    }).next().button({
      icons: {
	primary: "ui-icon-carat-1-e"
	},
      text: true
    });
  $(".submenu2 button").button();
</script>
