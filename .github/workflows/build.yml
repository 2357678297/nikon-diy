name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # 逐项目还原+构建:sln 里还有未迁移的 net48 项目(Setup/Plugin.DeviceControlBox 等),
      # sln 级 restore 会连带失败。以下覆盖全部已迁移项目。
      - name: Restore and build migrated projects (Release)
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        run: |
          projects=(
            PortableDeviceLib/PortableDeviceLib.csproj
            Canon.Eos.Framework/Canon.Eos.Framework.csproj
            CameraControl.Devices/CameraControl.Devices.csproj
            CameraControl.Core/CameraControl.Core.csproj
            CameraControl.Plugins/CameraControl.Plugins.csproj
            CameraControl.PluginManager/CameraControl.PluginManager.csproj
            CameraControlRemoteCmd/CameraControlRemoteCmd.csproj
            CameraControlCmd/CameraControlCmd.csproj
            CameraControl.Trigger/CameraControl.Trigger.csproj
            ZoomAndPan/ZoomAndPan.csproj
            MtpTester/MtpTester.csproj
            PhotoBooth/PhotoBooth.csproj
            DccObsPlugin/DccObsPlugin.csproj
            CameraControl/CameraControl.csproj
          )
          for p in "${projects[@]}"; do
            echo "=== $p ==="
            dotnet restore "$p" -v quiet || exit 1
            dotnet build "$p" -c Release --no-restore -v minimal || exit 1
          done
        shell: bash
